name: strategy lint

# Runs on every PR that touches `submissions/`. Deliberately the *safe* half of the pipeline:
#
#   * `pull_request`, never `pull_request_target` — the PR's own code must not run with repository
#     credentials, and a strategy PR is untrusted by definition.
#   * `permissions: contents: read` only. It reports through the check's own status, and writes nothing.
#   * No network, no secrets, no self-hosted runner. Linting a bundle is pure text work.
#
# Evaluation is not here and cannot be: episodes need the validator's pinned model on its own GPU, inside the
# sealed boundary. A miner sees lint here, and the scorecard on the PR after the round closes.

on:
  pull_request:
    paths:
      - "submissions/**"

permissions:
  contents: read

concurrency:
  group: strategy-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The three-dot diff below needs a merge base, and the default shallow fetch has none.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: One submission directory per pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Diff against the base commit the PR actually forked from, which checkout has already fetched. Only
          # files inside a submissions/<hotkey>/ directory are a bundle; submissions/README.md is documentation.
          changed=$(git diff --name-only "$BASE_SHA"...HEAD -- 'submissions/*/*' | cut -d/ -f1-2 | sort -u)
          echo "$changed"
          if [ -z "$changed" ]; then echo "no submission directory changed; nothing to lint"; exit 0; fi
          test "$(echo "$changed" | grep -c .)" -eq 1 || {
            echo "::error::a pull request may add or change exactly one submissions/<hotkey>/ directory"; exit 1; }
          if [ -n "$changed" ] && [ ! -d "$changed" ]; then
            echo "$changed was removed by this PR — nothing to lint"; changed=""
          fi
          echo "BUNDLE=$changed" >> "$GITHUB_ENV"

      - name: Check the submission (commitment-only while a submission server is advertised)
        if: env.BUNDLE != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # While the board advertises a submission server, a PR carries only the signed commitment (attestation.json,
        # and the server's receipt.json): the prose goes to the server. A PR that adds prose has made it public for
        # every rival to read, so the seal refuses it and so does this check. Deleting files is allowed (a king
        # removing its old, already public prose adds none). The signature is verified here when the library is
        # present, and always by the seal, which also binds the digest. With no server advertised, the full lint
        # runs on a bundle that carries its prose.
        run: |
          set -euo pipefail
          server=$(git show "$BASE_SHA:docs/live/live.json" 2>/dev/null \
            | python -c 'import json, sys; print(json.load(sys.stdin).get("submit_server") or "")' 2>/dev/null || true)
          if [ -n "$server" ]; then
            extra=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- "$BUNDLE/" \
              | grep -v -x -e "$BUNDLE/attestation.json" -e "$BUNDLE/receipt.json" || true)
            if [ -n "$extra" ]; then
              echo "::error::submissions are private: a PR adds only attestation.json under its directory, and the prose is uploaded to the submission server — run the CLI's submit, which does both"
              echo "files this PR adds or changes besides the commitment:"
              echo "$extra"
              exit 1
            fi
            python -m sh.cli.attest "$BUNDLE" --hotkey "$(basename "$BUNDLE")"
          elif [ -f "$BUNDLE/SOUL.md" ] || [ -d "$BUNDLE/skills" ]; then
            python -m sh.cli.lint "$BUNDLE" --require-attestation --hotkey "$(basename "$BUNDLE")"
          else
            python -m sh.cli.attest "$BUNDLE" --hotkey "$(basename "$BUNDLE")"
          fi

      - name: Summary
        if: env.BUNDLE != ''
        # Nothing from the pull request is echoed here. A bundle path or an attestation field is attacker
        # controlled, and inside a fenced block it can close the fence and inject markdown into the job summary.
        # The full report is already in the previous step's log.
        run: |
          echo "### Strategy check" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked the submission — see this job's log for the digest and the full report." >> "$GITHUB_STEP_SUMMARY"
